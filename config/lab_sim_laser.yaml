# microLIBS iberoLIBS 2026 — Configuración LABORATORIO (láser simulado + Ocean real)
# Para sesión 18/06/2026: validación de timing sin bloqueos TCP
# Copiar a session_dir/experiment.yaml para ejecutar con hardware Ocean real
# y láser simulado (operador dispara con control remoto físico)

experiment:
  name: "iberolibs_2026_laboratorio_sim_laser"
  sample_name: "muestra_cu_al"
  operator: "operador"
  base_dir: "~/microLIBS_captures"

hardware:
  stage_driver: "thorlabs"        # Hardware real Thorlabs Kinesis
  stage_port: ""                  # Auto-detecta puerto via Kinesis SDK
  trigger_mode: "soft_delay"      # soft_delay | ttl_arduino | none
  camera_backend: "chameleon"     # Hardware real: Chameleon FLIR PointGrey
  camera_id: 11470397             # Serial de Chameleon en labo
  use_arduino: false
  arduino_port: "COM3"
  arduino_baud: 115200

scan:
  settle_s: 0.20                  # Estabilización post-movimiento
  max_points: 0                   # 0 = usar todos (no limitar)
  stop_on_error: true             # Detener si falla un punto
  move_mode: "steps_mm"
  step_x_mm: 0.20                 # Resolución XY del scan
  step_y_mm: 0.20
  origin_x_mm: 0.0
  origin_y_mm: 0.0

laser:
  pulse_us: 200                   # Duración pulso (sim ignora, solo informativo)
  delay_us: 0                     # Pre-trigger delay
  n_pulsos: 1                     # Pulsos por punto (LIBS: 1 es típico)
  driver: "sim"                   # SIMULADO — operador dispara a mano con control remoto
                                  # No usa TCP, no bloquea, no interfiere con control remoto

spectrometer:
  driver: "ocean"                 # Hardware real Ocean Optics seabreeze
  trigger_mode: 3                 # 3=HW Edge LAMP SYNC (validado LIBS, Norberto confirmó 17/06)
  integration_us: 5000            # 5 ms — ajustar según respuesta plasma
  n_channels: 4                   # Módulos HR2000+ en rack
  # Los 4 operativos (sep-2026). PENDIENTE verificar scan completo con los 4.
  modulos_activos: ["HR+C1911", "HR+C1912", "HR+C1914", "HR+C1915"]  # UV, azul, VIS, NIR
  module_timeout_s: 40            # Timeout total — ventana de 40 s para disparar a mano
  averages: 1                     # 1 para LIBS pulsado (cada pulso es único)

pipeline:
  steps:
    - name: s00_setup
      critical: true
      params: {}
    - name: s01_calibrate
      critical: false
      params: {}
    - name: s02_preview
      critical: false
      params: {}
    - name: s03_scan
      critical: false
      params:
        settle_s: 0.20
        stop_on_error: true
